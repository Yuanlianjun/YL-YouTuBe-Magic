<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YouTube Knowledge Bridge</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand">▶ YouTube Knowledge Bridge</div><button id="settingsBtn" class="icon">⚙</button></header>
<div class="video"><div id="videoTitle">请打开一个 YouTube 视频</div><div id="channel" class="muted"></div></div>
<nav><button class="tab active" data-tab="transcript">字幕翻译</button><button class="tab" data-tab="summary">AI 总结</button><button class="tab" data-tab="mindmap">脑图</button><button class="tab" data-tab="settings">设置</button></nav>
<main>
<section id="transcript" class="pane active"><div class="row"><select id="viewMode"><option value="bilingual">中英双语</option><option value="zh">仅中文</option><option value="original">仅原文</option></select><button id="loadTranscript">获取字幕</button></div><div id="transcriptStatus" class="muted">优先获取英语字幕；没有字幕时尝试 AI 语音转录。</div><div id="transcriptList"></div><button id="translateBtn" class="primary">翻译字幕</button></section>
<section id="summary" class="pane"><button id="summarizeBtn" class="primary">生成中文总结</button><div id="summaryOut" class="output muted">总结会显示在这里。</div></section>
<section id="mindmap" class="pane"><button id="mindmapBtn" class="primary">生成脑图</button><div id="mindmapOut" class="mindmap muted">生成后可导出为 XMind 可导入的层级脑图。</div><button id="exportXmindMd" class="primary">导出 XMind 脑图（Markdown）</button><button id="exportMindmap">导出 Mermaid 脑图代码</button></section>
<section id="settings" class="pane"><label>字幕服务 API Key（Supadata）<input id="supadataKey" type="password" placeholder="Supadata API Key"></label><label>AI API 地址<input id="apiBase" placeholder="https://api.openai.com/v1"></label><label>AI API Key<input id="aiKey" type="password" placeholder="API Key"></label><label>模型名称<input id="model" placeholder="gpt-4o-mini"></label><label>Obsidian Vault 名称<input id="vault" placeholder="My Vault"></label><label>Obsidian 文件夹（可选）<input id="folder" placeholder="YouTube"></label><button id="saveSettings" class="primary">保存设置</button><p class="muted">API Key 仅保存在本机 Chrome storage。请勿把 Key 分享给他人。</p></section>
</main><footer><button id="saveObsidian" class="primary">保存到 Obsidian</button><button id="downloadMd">下载 Markdown</button><div id="status" class="muted"></div></footer><script src="sidepanel.js"></script></body></html>
